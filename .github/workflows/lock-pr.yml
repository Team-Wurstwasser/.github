name: Central PR Lock

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  lock:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Lock Pull Request ohne Grund
        run: gh pr lock ${{ github.event.pull_request.html_url }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
