name: Auto-Update README Table

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  ORG_NAME: "Team-Wurstwasser"
  README_PATH: "profile/README.md"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Abhängigkeiten installieren
      run: pip install requests

    - name: Skript ausführen
      run: python .github/update-readme.py

    - name: Änderungen committen und pushen
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add profile/README.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Repository-Liste aktualisiert" && git push)
